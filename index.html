<!DOCTYPE html>
<html lang="tr">
<html translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate">
  <title>İnternetten Sure Oku</title>
  <link rel="preload" href="fonts/AmiriQuran-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <video autoplay muted loop id="bgVideo">
    
    <source src="video/videoplayback.mp4" type="video/mp4" />
 
  
  </video>

  <main>
        <div class="theme-toggle">
      <button id="toggleTheme">🌙 Tema Değiştir</button>
    </div>
    <div class="dropdown-frame">
      <select id="surahSelect"></select>
      <div class="button-group">
        <button id="playButton">🔊 Oynat</button>
        <button id="resumeButton">🔁 Devam Ettir</button>
        <button id="stopButton">⏹ Durdur</button>
        <button id="showMealButton">📖 Meali Göster</button>
      </div>
    </div>

    <div id="verseContainer"></div>

    <div id="mealContainer" class="meal-frame hidden">
      <h3>Türkçe Meal</h3>
      <div id="mealText"></div>
    </div>
  </main>

  <script src="script.js" defer></script>

</body>
</html>
